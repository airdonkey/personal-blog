baseURL = "https://zhoupenglong.com/"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = true
timeZone = "Pacific/Auckland"
enableRobotsTXT = true
summaryLength = 36

[languages]
  [languages.zh]
    locale = "zh-CN"
    label = "中文"
    weight = 1
    title = "周鹏龙 | 无名者的自我建造"
    
    [languages.zh.params]
      author = "周鹏龙"
      description = "写作者与教育工作者"
      meta_description = "关于教育、社会流动与个人能动性的长期写作。"
      tagline = "无名者的自我构建"
      credo = "不神化努力，也不向结构投降。"
      introduction = "写一个没有背景的小镇做题家，如何在迁徙、职业转换与时代变化中，一次次重新建造自己。"
      email = "contact@zhoupenglong.com"
    
    [[languages.zh.menu.main]]
      identifier = "navArticles"
      name = "文章"
      url = "/zh/posts/"
      weight = 1

    [[languages.zh.menu.main]]
      identifier = "navMemoir"
      name = "来时路"
      url = "/zh/memoir/"
      weight = 2
    
    [[languages.zh.menu.main]]
      identifier = "navThemes"
      name = "主题"
      url = "/zh/themes/"
      weight = 3
    
    [[languages.zh.menu.main]]
      identifier = "navPractice"
      name = "实践"
      url = "/zh/work/"
      weight = 4
    
    [[languages.zh.menu.main]]
      identifier = "navAbout"
      name = "关于"
      url = "/zh/about/"
      weight = 5

    [languages.zh.permalinks]
      [languages.zh.permalinks.page]
        journeys = "/grand-tour/:slug/"
      [languages.zh.permalinks.section]
        journeys = "/grand-tour/stories/"

  [languages.en]
    locale = "en-US"
    label = "English"
    weight = 2
    title = "Zhou Penglong | Building a Life Across Changing Systems"
    
    [languages.en.params]
      author = "Zhou Penglong"
      description = "Writer & Educator"
      meta_description = "Essays on education, social mobility and human agency across China and New Zealand."
      tagline = "Building a Life Across Changing Systems"
      credo = "Education • Social Mobility • Human Agency"
      introduction = "Writing across China and New Zealand about what education can change, what inherited rules cannot solve, and how ordinary people preserve room to act."
      email = "contact@zhoupenglong.com"
    
    [[languages.en.menu.main]]
      identifier = "navArticles"
      name = "Articles"
      url = "/en/posts/"
      weight = 1

    [[languages.en.menu.main]]
      identifier = "navMemoir"
      name = "Memoir"
      url = "/en/memoir/"
      weight = 2
    
    [[languages.en.menu.main]]
      identifier = "navThemes"
      name = "Themes"
      url = "/en/themes/"
      weight = 3
    
    [[languages.en.menu.main]]
      identifier = "navPractice"
      name = "Practice"
      url = "/en/work/"
      weight = 4
    
    [[languages.en.menu.main]]
      identifier = "navAbout"
      name = "About"
      url = "/en/about/"
      weight = 5

    [languages.en.permalinks]
      [languages.en.permalinks.page]
        journeys = "/grand-tour/:slug/"
      [languages.en.permalinks.section]
        journeys = "/grand-tour/stories/"

[taxonomies]
  tag = "tags"
  series = "series"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]
