baseURL = "https://zhoupenglong.com/"
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = true

[languages]
  [languages.zh]
    languageCode = "zh-CN"
    languageName = "中文"
    weight = 1
    title = "周鹏龙 | 跨文化观察与学习"
    
    [languages.zh.params]
      author = "周鹏龙"
      description = "教育工作者 & 天文学会执行秘书"
      tagline = "记录跨文化观察与终身学习"
      email = "contact@zhoupenglong.com"
    
    [[languages.zh.menu.main]]
      name = "文章"
      url = "/zh/posts/"
      weight = 1
    
    [[languages.zh.menu.main]]
      name = "游历"
      url = "/zh/grand-tour/"
      weight = 2
    
    [[languages.zh.menu.main]]
      name = "关于"
      url = "/zh/about/"
      weight = 3
    
    [[languages.zh.menu.main]]
      name = "联系"
      url = "/zh/contact/"
      weight = 4

  [languages.en]
    languageCode = "en-US"
    languageName = "English"
    weight = 2
    title = "Zhou Penglong | Cross-Cultural Learning"
    
    [languages.en.params]
      author = "Zhou Penglong"
      description = "Educator & Executive Secretary of RASNZ"
      tagline = "Cross-Cultural Observations & Lifelong Learning"
      email = "contact@zhoupenglong.com"
    
    [[languages.en.menu.main]]
      name = "Articles"
      url = "/en/posts/"
      weight = 1
    
    [[languages.en.menu.main]]
      name = "Grand Tour"
      url = "/en/grand-tour/"
      weight = 2
    
    [[languages.en.menu.main]]
      name = "About"
      url = "/en/about/"
      weight = 3
    
    [[languages.en.menu.main]]
      name = "Contact"
      url = "/en/contact/"
      weight = 4

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
