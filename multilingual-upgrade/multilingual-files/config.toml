baseURL = "https://zhoupenglong.com/"
defaultContentLanguage = "zh"  # 默认语言为中文
defaultContentLanguageInSubdir = true  # 中文也使用 /zh/ 子目录

# 语言配置
[languages]
  [languages.zh]
    languageCode = "zh-CN"
    languageName = "中文"
    weight = 1
    title = "周鹏龙 | 战略与技术"
    
    [languages.zh.params]
      author = "周鹏龙"
      description = "战略咨询顾问 & 技术专家"
      tagline = "连接商业战略与数字创新"
      email = "your.email@example.com"
      linkedin = "https://linkedin.com/in/zhoupenglong"
      twitter = "https://twitter.com/zhoupenglong"
      github = "https://github.com/zhoupenglong"
    
    [[languages.zh.menu.main]]
      name = "文章"
      url = "/zh/posts/"
      weight = 1
    
    [[languages.zh.menu.main]]
      name = "关于"
      url = "/zh/about/"
      weight = 2
    
    [[languages.zh.menu.main]]
      name = "联系"
      url = "/zh/contact/"
      weight = 3

  [languages.en]
    languageCode = "en-US"
    languageName = "English"
    weight = 2
    title = "Zhou Penglong | Strategy & Technology"
    
    [languages.en.params]
      author = "Zhou Penglong"
      description = "Strategy Consultant & Technology Advisor"
      tagline = "Bridging Business Strategy and Digital Innovation"
      email = "your.email@example.com"
      linkedin = "https://linkedin.com/in/zhoupenglong"
      twitter = "https://twitter.com/zhoupenglong"
      github = "https://github.com/zhoupenglong"
    
    [[languages.en.menu.main]]
      name = "Articles"
      url = "/en/posts/"
      weight = 1
    
    [[languages.en.menu.main]]
      name = "About"
      url = "/en/about/"
      weight = 2
    
    [[languages.en.menu.main]]
      name = "Contact"
      url = "/en/contact/"
      weight = 3

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
