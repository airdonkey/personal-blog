        path: content
        format: yaml-frontmatter
        subfolders: false
        exclude:
          - about.zh.md
          - about.en.md
          - grand-tour.zh.md
          - grand-tour.en.md
        operations:
          create: false
          rename: false
          delete: false
        view:
          fields: [title, description]
          primary: title
          sort: [title]
          search: [title, description]
        fields:
          - name: title
            label: 标题 / Title
            type: string
            required: true
          - name: description
            label: 页面简介 / Description
            type: text
            required: false
          - name: type
            type: string
            hidden: true
          - name: layout
            type: string
            hidden: true
          - name: translationKey
            type: string
            hidden: true
          - name: body
            label: 页面正文 / Page body
            type: rich-text
            required: false
            options:
              format: markdown
              switcher: true
              media: article_images

settings:
  hide: true
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "CMS: create {filename}"
      update: "CMS: update {filename}"
      delete: "CMS: delete {filename}"
      rename: "CMS: rename {oldFilename} -> {newFilename}"
