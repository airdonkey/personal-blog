media:
  - name: article_images
    label: 文章图片 / Article images
    input: static/images/articles
    output: /images/articles
    rename: safe
    categories: [image]
  - name: travel_images
    label: 游历照片（网页版本）/ Grand Tour web images
    input: static/images/travel
    output: /images/travel
    rename: safe
    categories: [image]

components:
  language:
    type: select
    label: 语言 / Language
    required: true
    options:
      values:
        - name: zh
          label: 中文
        - name: en
          label: English

  content_status:
    type: select
    label: 公开完成度 / Public status
    required: true
    default: working
    description: “持续写作中”会公开显示工作台提示；文章真正完成后再改为“完成”。
    options:
      values:
        - name: working
          label: 持续写作中 / Work in progress
        - name: complete
          label: 已完成 / Complete

  url_slug:
    type: string
    label: 网址英文短名 / URL slug
    required: true
    description: 只用小写英文字母、数字和连字符。发布后尽量不要修改，以保持链接稳定。
    pattern:
      regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
      message: 请使用小写英文字母、数字和连字符，例如 ai-and-education。

  controlled_tags:
    type: select
    label: 具体话题（最多两个）/ Topics (maximum two)
    required: false
    description: 标签只回答“具体写了什么”。从固定词表选择；没有合适的可以留空，不要临时创造新标签。
    options:
      multiple: true
      max: 2
      placeholder: 选择零到两个具体话题
      values:
        - name: education
          label: 专业｜教育 / Education
        - name: work-and-organisations
          label: 专业｜职业与组织 / Work and organisations
        - name: risk-and-decisions
          label: 专业｜风险与决策 / Risk and decisions
        - name: technology-and-ai
          label: 专业｜技术与 AI / Technology and AI
        - name: language-and-writing
          label: 方法｜语言与写作 / Language and writing
        - name: attention-and-time
          label: 方法｜注意力与时间 / Attention and time
        - name: china
          label: 地域｜中国 / China
        - name: central-asia
          label: 地域｜中亚 / Central Asia
        - name: new-zealand
          label: 地域｜新西兰 / New Zealand
        - name: astronomy
          label: 兴趣｜天文 / Astronomy
        - name: books-and-reading
          label: 兴趣｜书与阅读 / Books and reading
        - name: history-and-civilisation
          label: 兴趣｜历史与文明 / History and civilisation
        - name: film
          label: 兴趣｜电影 / Film
        - name: music
          label: 兴趣｜音乐 / Music
        - name: maps-and-geography
          label: 兴趣｜地图与地理 / Maps and geography
        - name: comics-and-imagination
          label: 兴趣｜漫画与想象 / Comics and imagination

  writing_theme:
    type: select
    label: 长期母题 / Long-term theme
    required: true
    description: 主文只进入一个母题。若现在还无法选择，它更适合先写成“小径”，不必勉强拔高。
    options:
      placeholder: 选择这篇文章最终回答的一个长期问题
      values:
        - name: self-building
          label: 无名者的自我建造 / The work of rebuilding
        - name: migration
          label: 迁徙与重新命名 / Migration and being renamed
        - name: work-and-learning
          label: 职业转换与终身学习 / Career change and lifelong learning
        - name: education-and-technology
          label: 教育、代际与人的尺度 / Education, generations, and human scale

content:
  - name: articles
    label: 主文（完整论述）/ Essays
    type: collection
    path: content/posts
    format: yaml-frontmatter
    exclude:
      - _index.zh.md
      - _index.en.md
    subfolders: false
    filename:
      template: "{fields.date}-{fields.slug}.{fields.language}.md"
      field: false
    operations:
      create: true
      rename: true
      delete: true
    view:
      fields: [title, date, language, status, featured, draft]
      primary: title
      sort: [date, title]
      search: [title, description, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 标题 / Title
        type: string
        required: true
      - name: date
        label: 发布日期 / Publication date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: language
        component: language
      - name: slug
        component: url_slug
      - name: draft
        label: 草稿 / Draft
        type: boolean
        default: true
      - name: status
        component: content_status
      - name: nextStep
        label: 下一次只补什么 / One next writing step
        type: text
        required: false
        description: 公开显示在工作台提示里。只写一个最小动作，不列完整任务清单。
        options:
          maxlength: 180
      - name: description
        label: 摘要 / Summary
        type: text
        required: false
        options:
          minlength: 20
          maxlength: 220
      - name: workingThesis
        label: 这篇只想说清的一句话 / Working thesis
        type: text
        required: false
        description: 仅供写作时聚焦，不会显示在网站上。先写判断，再开始正文。
        options:
          maxlength: 240
      - name: series
        component: writing_theme
      - name: tags
        component: controlled_tags
      - name: featured
        label: 首页精选 / Homepage feature
        type: boolean
        default: false
        description: 通常保持关闭。只为最能向新访客介绍你的3至5篇主文打开。
      - name: readerQuestion
        label: 文末读者问题 / Reader question
        type: text
        required: false
        description: 用一个具体问题邀请读者回应；留空时网站会使用默认问题。
        options:
          maxlength: 180
      - name: translationKey
        label: 双语关联键 / Translation key
        type: string
        required: false
        description: 中英文版本填写相同的简短英文键；只有一个语言版本时可留空。
        pattern: "^[a-z0-9-]*$"
      - name: body
        label: 正文 / Body
        type: rich-text
        required: true
        default: |
          ## 从一个具体场景开始

          写下当时在哪里、发生了什么，以及你首先注意到的细节。先不要解释道理。

          ## 我真正想说的一句话

          这件事改变或印证了你的什么判断？这一篇只保留一个核心判断。

          ## 事情没有那么简单

          写出与你的判断相反的一面、结构限制，或者你自己仍然无法回答的问题。

          ## 它对普通人意味着什么

          从个人经历回到读者：为什么一个没有相同经历的人仍然值得读完？

          ## 留下一个问题

          用一个具体问题结束，并把同一个问题填写到上方的“文末读者问题”。
        options:
          format: markdown
          switcher: true
          media: article_images
          rename: safe

  - name: memoirs
    label: 来时路（个人生活史）/ Memoir
    type: collection
    path: content/memoir
    format: yaml-frontmatter
    exclude:
      - _index.zh.md
      - _index.en.md
    subfolders: false
    filename:
      template: "{fields.date}-{fields.slug}.{fields.language}.md"
      field: false
    operations:
      create: true
      rename: true
      delete: true
    view:
      fields: [title, period, stage, language, status, featured, draft]
      primary: title
      sort: [memoryOrder, title]
      search: [title, description, place]
      default:
        sort: memoryOrder
        order: asc
    fields:
      - name: title
        label: 记忆标题 / Memory title
        type: string
        required: true
      - name: date
        label: 本页发布日期 / Page publication date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: language
        component: language
      - name: slug
        component: url_slug
      - name: draft
        label: 草稿 / Draft
        type: boolean
        default: true
      - name: status
        component: content_status
      - name: nextStep
        label: 下一次只补什么 / One next writing step
        type: text
        required: false
        description: 只指定一个现场、一件物品或一段关系，降低下次启动成本。
        options:
          maxlength: 180
      - name: description
        label: 这一段记忆为何值得留下 / Why this memory matters
        type: text
        required: true
        options:
          maxlength: 220
      - name: stage
        label: 人生阶段 / Life stage
        type: select
        required: true
        options:
          values:
            - name: origins
              label: 01 来处与家庭 / Origins and family
            - name: beijing-study
              label: 02 北京求学 / Studying in Beijing
            - name: beijing-life
              label: 03 北京生活与职业 / Life and work in Beijing
            - name: central-asia
              label: 04 中亚与远行 / Central Asia and leaving
            - name: new-zealand
              label: 05 新西兰重建 / Rebuilding in New Zealand
            - name: returning
              label: 06 重返与回望 / Returning and looking back
      - name: period
        label: 对外显示的时间 / Public period
        type: string
        required: true
        description: 可以写年份或人生阶段；不必公开精确日期。
      - name: place
        label: 地点 / Place
        type: string
        required: false
      - name: memoryOrder
        label: 阶段内顺序 / Order within stage
        type: number
        required: true
        description: 使用10、20、30，日后可在中间插入新文章。
      - name: tags
        component: controlled_tags
      - name: featured
        label: 首页展示 / Feature on homepage
        type: boolean
        default: false
        description: 通常只打开一篇最能让新读者认识你的来时路。
      - name: readerQuestion
        label: 文末记忆问题 / Closing memory question
        type: text
        required: false
        options:
          maxlength: 180
      - name: translationKey
        label: 双语关联键 / Translation key
        type: string
        required: false
        pattern: "^[a-z0-9-]*$"
      - name: body
        label: 正文 / Body
        type: rich-text
        required: true
        default: |
          ## 我记得的一个现场

          先保存房间、街道、物件、声音或一句原话。不要急着证明它代表一个时代。

          ## 当时的我并不知道

          写下今天回看才看清的变化，但允许当年的自己保留局限。

          ## 这段个人记忆与谁相连

          从“我”走向同代人的共同经验；不替整整一代人下结论。

          ## 待补证据

          列出下一次只需补入的照片、地名、年份或对话。
        options:
          format: markdown
          switcher: true
          media: article_images
          rename: safe

  - name: notes
    label: 小径（短札记）/ Side Paths
    type: collection
    path: content/notes
    format: yaml-frontmatter
    exclude:
      - _index.zh.md
      - _index.en.md
    subfolders: false
    filename:
      template: "{fields.date}-{fields.slug}.{fields.language}.md"
      field: false
    operations:
      create: true
      rename: true
      delete: true
    view:
      fields: [title, date, language, status, draft]
      primary: title
      sort: [date, title]
      search: [title, description, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 标题 / Title
        type: string
        required: true
      - name: date
        label: 发布日期 / Publication date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: language
        component: language
      - name: slug
        component: url_slug
      - name: draft
        label: 草稿 / Draft
        type: boolean
        default: true
      - name: status
        component: content_status
      - name: nextStep
        label: 下一次只补什么 / One next writing step
        type: text
        required: false
        options:
          maxlength: 180
      - name: description
        label: 一句话说明（可留空）/ One-line summary (optional)
        type: text
        required: false
        options:
          maxlength: 180
      - name: tags
        component: controlled_tags
      - name: translationKey
        label: 双语关联键 / Translation key
        type: string
        required: false
        description: 中英文版本填写相同的简短英文键；只有一个语言版本时可留空。
        pattern: "^[a-z0-9-]*$"
      - name: body
        label: 正文 / Body
        type: rich-text
        required: true
        default: |
          ## 我注意到的细节

          先写下触发这个念头的书、画面、声音、地方或一句话。

          ## 它让我想到

          只向前走一步：它与你的哪段经验或哪个问题发生了联系？写到这里就可以停下。
        options:
          format: markdown
          switcher: true
          media: article_images
          rename: safe

  - name: journeys
    label: 旅程与照片故事 / Journeys and photo stories
    type: collection
    path: content/journeys
    format: yaml-frontmatter
    exclude:
      - _index.zh.md
      - _index.en.md
    subfolders: false
    filename:
      template: "{fields.date}-{fields.slug}.{fields.language}.md"
      field: false
    operations:
      create: true
      rename: true
      delete: true
    view:
      fields: [title, journeyYear, language, status, featured, draft]
      primary: title
      sort: [journeyYear, title]
      search: [title, description, route]
      default:
        sort: journeyYear
        order: desc
    fields:
      - name: title
        label: 旅程标题 / Journey title
        type: string
        required: true
      - name: date
        label: 本页发布日期 / Page publication date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: language
        component: language
      - name: slug
        component: url_slug
      - name: draft
        label: 草稿 / Draft
        type: boolean
        default: true
      - name: status
        component: content_status
      - name: nextStep
        label: 下一次只补什么 / One next writing step
        type: text
        required: false
        description: 例如“到现场补三张同机位照片”，不要把整个旅行计划塞进来。
        options:
          maxlength: 180
      - name: description
        label: 这段旅程为什么值得记住 / Why this journey matters
        type: text
        required: true
        options:
          maxlength: 240
      - name: journeyYear
        label: 旅程开始年份 / Journey start year
        type: number
        required: true
        description: 只用于时间轴排序，例如2009。
      - name: journeyPeriod
        label: 对外显示的时间 / Public date label
        type: string
        required: true
        description: 可以写“2009年10月”或“2016年1月—2017年5月”，不必编造具体日期。
      - name: route
        label: 路线 / Route
        type: text
        required: false
        description: 按顺序填写，例如“曼谷 → 伊斯坦布尔 → 伊兹密尔 → 卡帕多奇亚”。
        options:
          maxlength: 320
      - name: heroImage
        label: 人工选定的主图 / Curated hero image
        type: image
        required: false
        options:
          media: travel_images
          categories: [image]
          rename: safe
      - name: featured
        label: Grand Tour 首页精选 / Feature on Grand Tour
        type: boolean
        default: false
        description: 通常保持关闭；完整度最高、最能代表你的三段旅程才打开。
      - name: relatedTheme
        label: 相关长期母题（可留空）/ Related long-term theme (optional)
        type: select
        required: false
        description: 只有联系自然时才选择，不需要把每段旅行强行拔高。
        options:
          values:
            - name: self-building
              label: 无名者的自我建造 / The work of rebuilding
            - name: migration
              label: 迁徙与重新命名 / Migration and being renamed
            - name: work-and-learning
              label: 职业转换与终身学习 / Career change and lifelong learning
            - name: education-and-technology
              label: 教育、代际与人的尺度 / Education, generations, and human scale
      - name: gallery
        label: 精选照片（建议8至20张）/ Curated photographs (8–20 recommended)
        type: object
        required: false
        list:
          max: 20
          collapsible:
            collapsed: true
            summary: "{place} · {index}"
        fields:
          - name: image
            label: 网页照片 / Web image
            type: image
            required: true
            options:
              media: travel_images
              categories: [image]
              rename: safe
          - name: alt
            label: 图片替代文字 / Alt text
            type: string
            required: true
            description: 客观描述画面，供无法看图的读者理解。
          - name: caption
            label: 照片说明 / Caption
            type: text
            required: false
          - name: place
            label: 拍摄地点 / Place
            type: string
            required: false
      - name: translationKey
        label: 双语关联键 / Translation key
        type: string
        required: false
        pattern: "^[a-z0-9-]*$"
      - name: body
        label: 游记正文 / Travelogue
        type: rich-text
        required: false
        default: |
          ## 抵达

          从一个具体场景开始：光线、声音、天气、身体感受，或者一句当时听见的话。

          ## 沿途

          不必写成景点清单。选择两三个真正改变你观察方式的现场。

          ## 当时的我，今天的我

          当时怎样理解这段旅程？多年以后，又有哪些判断发生了变化？
        options:
          format: markdown
          switcher: true
          media: travel_images
          rename: safe

  - name: site_pages
    label: 固定页面 / Core pages
    type: group
    items:
      - name: profile_zh
        label: 中文个人简介
        type: file
        path: content/about.zh.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 页面标题
            type: string
            readonly: true
          - name: description
            label: 搜索与分享摘要
            type: text
            required: true
          - name: shortTitle
            label: 首页简介标题
            type: string
            required: true
          - name: shortBio
            label: 首页短简介
            type: text
            required: true
            description: 首页使用。尽量控制在三句话内；详细内容继续写在正文。
          - name: type
            type: string
            hidden: true
          - name: layout
            type: string
            hidden: true
          - name: translationKey
            type: string
            hidden: true
          - name: body
            label: 完整个人简介
            type: rich-text
            required: true
            options:
              format: markdown
              switcher: true
              media: article_images

      - name: profile_en
        label: English profile
        type: file
        path: content/about.en.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: Page title
            type: string
            readonly: true
          - name: description
            label: Search and sharing summary
            type: text
            required: true
          - name: shortTitle
            label: Homepage profile heading
            type: string
            required: true
          - name: shortBio
            label: Homepage short profile
            type: text
            required: true
          - name: type
            type: string
            hidden: true
          - name: layout
            type: string
            hidden: true
          - name: translationKey
            type: string
            hidden: true
          - name: body
            label: Full profile
            type: rich-text
            required: true
            options:
              format: markdown
              switcher: true
              media: article_images

      - name: tour_zh
        label: 中文 Grand Tour 说明
        type: file
        path: content/grand-tour.zh.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: 页面标题
            type: string
            readonly: true
          - name: description
            label: 页面主说明
            type: text
            required: true
          - name: heroImage
            label: Grand Tour 首页主图（可稍后添加）
            type: image
            required: false
            options:
              media: travel_images
              categories: [image]
              rename: safe
          - name: type
            type: string
            hidden: true
          - name: layout
            type: string
            hidden: true
          - name: translationKey
            type: string
            hidden: true
          - name: body
            label: Grand Tour 宣言
            type: rich-text
            required: true
            options:
              format: markdown
              switcher: true
              media: travel_images

      - name: tour_en
        label: English Grand Tour introduction
        type: file
        path: content/grand-tour.en.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: Page title
            type: string
            readonly: true
          - name: description
            label: Page introduction
            type: text
            required: true
          - name: heroImage
            label: Grand Tour hero image (optional for now)
            type: image
            required: false
            options:
              media: travel_images
              categories: [image]
              rename: safe
          - name: type
            type: string
            hidden: true
          - name: layout
            type: string
            hidden: true
          - name: translationKey
            type: string
            hidden: true
          - name: body
            label: Grand Tour manifesto
            type: rich-text
            required: true
            options:
              format: markdown
              switcher: true
              media: travel_images

      - name: supporting_pages
        label: 其他栏目页面 / Supporting pages
        type: collection
        path: content
        format: yaml-frontmatter
        subfolders: false
        exclude:
          - about.zh.md
          - about.en.md
          - grand-tour.zh.md
          - grand-tour.en.md
        operations:
          create: false
          rename: false
          delete: false
        view:
          fields: [title, description]
          primary: title
          sort: [title]
          search: [title, description]
        fields:
          - name: title
            label: 标题 / Title
            type: string
            readonly: true
          - name: description
            label: 页面简介 / Description
            type: text
            required: false
          - name: type
            type: string
            hidden: true
          - name: layout
            type: string
            hidden: true
          - name: translationKey
            type: string
            hidden: true
          - name: body
            label: 页面正文 / Page body
            type: rich-text
            required: false
            options:
              format: markdown
              switcher: true
