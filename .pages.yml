  - name: articles
    label: 主文（完整论述）/ Essays
    type: collection
    path: content/posts
    format: yaml-frontmatter
    exclude:
      - _index.zh.md
      - _index.en.md
    subfolders: false
    filename:
      template: "{fields.date}-{fields.slug}.{fields.language}.md"
      field: false
    operations:
      create: true
      rename: true
      delete: true
    view:
      fields: [title, date, language, status, featured, draft]
      primary: title
      sort: [date, title]
      search: [title, description, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 标题 / Title
        type: string
        required: true
      - name: date
        label: 发布日期 / Publication date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: language
        component: language
      - name: slug
        component: url_slug
      - name: body
        label: 正文 / Body
        type: rich-text
        required: true
        description: 直接像普通文档一样书写。选中文字可设置格式；在空白行输入 / 可插入图片、表格、引用或代码。图片或已导出的图表也可直接粘贴、拖入，系统会自动上传并写入正确路径。
        default: |
          ## 从一个具体场景开始

          写下当时在哪里、发生了什么，以及你首先注意到的细节。先不要解释道理。

          ## 我真正想说的一句话

          这件事改变或印证了你的什么判断？这一篇只保留一个核心判断。

          ## 事情没有那么简单

          写出与你的判断相反的一面、结构限制，或者你自己仍然无法回答的问题。

          ## 它对普通人意味着什么

          从个人经历回到读者：为什么一个没有相同经历的人仍然值得读完？

          ## 留下一个问题

          用一个具体问题结束，并把同一个问题填写到下方的“文末读者问题”。
        options:
          format: markdown
          switcher: false
          media: article_images
          rename: safe
      - name: draft
        label: 草稿 / Draft
        type: boolean
        default: true
      - name: status
        component: content_status
      - name: nextStep
        label: 下一次只补什么 / One next writing step
        type: text
        required: false
        description: 公开显示在工作台提示里。只写一个最小动作，不列完整任务清单。
        options:
          maxlength: 180
      - name: description
        label: 摘要 / Summary
        type: text
        required: false
        options:
          minlength: 20
          maxlength: 220
      - name: workingThesis
        label: 这篇只想说清的一句话 / Working thesis
        type: text
        required: false
        description: 仅供写作时聚焦，不会显示在网站上。先写判断，再开始正文。
        options:
          maxlength: 240
      - name: series
        component: writing_theme
      - name: tags
        component: controlled_tags
      - name: featured
        label: 首页精选 / Homepage feature
        type: boolean
        default: false
        description: 通常保持关闭。只为最能向新访客介绍你的3至5篇主文打开。
      - name: readerQuestion
        label: 文末读者问题 / Reader question
        type: text
        required: false
        description: 用一个具体问题邀请读者回应；留空时网站会使用默认问题。
        options:
          maxlength: 180
      - name: translationKey
        label: 双语关联键 / Translation key
        type: string
        required: false
        description: 中英文版本填写相同的简短英文键；只有一个语言版本时可留空。
        pattern: "^[a-z0-9-]*$"
      - name: images
        label: 社交分享图路径 / Social sharing image paths
        type: string
        required: false
        list: true
        description: 第一张用于 LinkedIn、Open Graph 和 Twitter；请使用 1200×630 图片，例如 /images/social/article-name.png。
  - name: memoirs
    label: 来时路（个人生活史）/ Memoir
    type: collection
    path: content/memoir
    format: yaml-frontmatter
    exclude:
      - _index.zh.md
      - _index.en.md
    subfolders: false
    filename:
      template: "{fields.date}-{fields.slug}.{fields.language}.md"
      field: false
    operations:
      create: true
      rename: true
      delete: true
    view:
      fields: [title, period, stage, language, status, featured, draft]
      primary: title
      sort: [memoryOrder, title]
      search: [title, description, place]
      default:
        sort: memoryOrder
        order: asc
    fields:
      - name: title
        label: 记忆标题 / Memory title
        type: string
        required: true
      - name: date
        label: 本页发布日期 / Page publication date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: language
        component: language
      - name: slug
        component: url_slug
      - name: body
        label: 正文 / Body
        type: rich-text
        required: true
        description: 直接像普通文档一样书写。选中文字可设置格式；在空白行输入 / 可插入图片、表格、引用或代码。图片或已导出的图表也可直接粘贴、拖入，系统会自动上传并写入正确路径。
        default: |
          ## 我记得的一个现场

          先保存房间、街道、物件、声音或一句原话。不要急着证明它代表一个时代。

          ## 当时的我并不知道

          写下今天回看才看清的变化，但允许当年的自己保留局限。

          ## 这段个人记忆与谁相连

          从“我”走向同代人的共同经验；不替整整一代人下结论。

          ## 待补证据

          列出下一次只需补入的照片、地名、年份或对话。
        options:
          format: markdown
          switcher: false
          media: article_images
          rename: safe
      - name: draft
        label: 草稿 / Draft
        type: boolean
        default: true
      - name: status
        component: content_status
      - name: nextStep
        label: 下一次只补什么 / One next writing step
        type: text
        required: false
        description: 只指定一个现场、一件物品或一段关系，降低下次启动成本。
        options:
          maxlength: 180
      - name: description
        label: 这一段记忆为何值得留下 / Why this memory matters
        type: text
        required: true
        options:
          maxlength: 220
      - name: stage
        label: 人生阶段 / Life stage
        type: select
        required: true
        options:
          values:
            - name: origins
              label: 01 来处与家庭 / Origins and family
            - name: beijing-study
              label: 02 北京求学 / Studying in Beijing
            - name: beijing-life
              label: 03 北京生活与职业 / Life and work in Beijing
            - name: central-asia
              label: 04 中亚与远行 / Central Asia and leaving
            - name: new-zealand
              label: 05 新西兰重建 / Rebuilding in New Zealand
            - name: returning
              label: 06 重返与回望 / Returning and looking back
      - name: period
        label: 对外显示的时间 / Public period
        type: string
        required: true
        description: 可以写年份或人生阶段；不必公开精确日期。
      - name: place
        label: 地点 / Place
        type: string
        required: false
      - name: memoryOrder
        label: 阶段内顺序 / Order within stage
        type: number
        required: true
        description: 使用10、20、30，日后可在中间插入新文章。
      - name: tags
        component: controlled_tags
      - name: featured
        label: 首页展示 / Feature on homepage
        type: boolean
        default: false
        description: 通常只打开一篇最能让新读者认识你的来时路。
      - name: readerQuestion
        label: 文末记忆问题 / Closing memory question
        type: text
        required: false
        options:
          maxlength: 180
      - name: translationKey
        label: 双语关联键 / Translation key
        type: string
        required: false
        pattern: "^[a-z0-9-]*$"
