<header class="site-header">
    <div class="container">
        <div class="header-content">
            <a href="{{ .Site.BaseURL }}{{ .Site.Language.Lang }}/" class="site-logo">
                <img src="{{ "images/badge.svg" | relURL }}" 
                     alt="{{ .Site.Params.author }}" 
                     class="nav-badge">
                <span class="site-name">{{ .Site.Params.author }}</span>
            </a>
            
            <div class="header-right">
                <nav class="main-nav">
                    <ul>
                        {{ range .Site.Menus.main }}
                        <li><a href="{{ .URL }}">{{ .Name }}</a></li>
                        {{ end }}
                    </ul>
                </nav>
                
                {{ partial "language-switcher.html" . }}
            </div>
        </div>
    </div>
</header>

<style>
.header-right {
    display: flex;
    align-items: center;
    gap: var(--space-lg);
}

@media (max-width: 768px) {
    .header-content {
        flex-direction: column;
        gap: var(--space-md);
    }
    
    .header-right {
        width: 100%;
        justify-content: space-between;
    }
    
    .main-nav ul {
        gap: var(--space-md);
    }
}
</style>
