<div class="language-switcher">
    {{ if .IsTranslated }}
        {{ range .Translations }}
            <a href="{{ .Permalink }}" 
               class="lang-link {{ if eq .Language.Lang $.Language.Lang }}active{{ end }}"
               title="Switch to {{ .Language.LanguageName }}">
                {{ if eq .Language.Lang "zh" }}中{{ else }}EN{{ end }}
            </a>
        {{ end }}
    {{ end }}
    <a href="{{ .Permalink }}" 
       class="lang-link active"
       title="Current: {{ .Language.LanguageName }}">
        {{ if eq .Language.Lang "zh" }}中{{ else }}EN{{ end }}
    </a>
</div>

<style>
.language-switcher {
    display: flex;
    gap: 0.5rem;
    align-items: center;
}

.lang-link {
    padding: 0.4rem 0.8rem;
    border: 1px solid var(--gray-300);
    border-radius: 4px;
    font-size: 0.9rem;
    font-weight: 600;
    transition: var(--transition);
    text-decoration: none;
    color: var(--text-secondary);
}

.lang-link:hover {
    background: var(--bronze-subtle);
    border-color: var(--bronze);
    color: var(--navy-dark);
}

.lang-link.active {
    background: var(--bronze);
    color: var(--white);
    border-color: var(--bronze);
}

.lang-link.active:hover {
    transform: none;
    cursor: default;
}
</style>
