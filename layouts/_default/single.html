{{ define "main" }}
<header class="page-header">
    <div class="page-frame narrow-header">
        <p class="eyebrow">{{ partial "identity.html" "author" }}</p>
        <h1>{{ .Title }}</h1>
        {{ with .Description }}<p>{{ . }}</p>{{ end }}
    </div>
</header>
<div class="reading-frame prose static-prose section-space">
    {{ .Content }}
</div>
{{ end }}
